<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'none'; connect-src 'none'; font-src 'self'; object-src 'none'; frame-src 'none'; media-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#f5f6f3">
  <title>Seite nicht gefunden | LD Express</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/ld-express/favicon-32.png">
  <link rel="stylesheet" href="/ld-express/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/ld-express/" aria-label="LD Express Startseite">
        <img src="/ld-express/logo-lockup.png" width="1343" height="224" alt="LD Express">
      </a>
      <span class="header-status">Nicht aktiv</span>
    </div>
  </header>

  <main class="shell error-main">
    <div class="error-content">
      <p class="error-code">Fehler 404</p>
      <h1>Diese Seite wurde nicht gefunden.</h1>
      <p>Der aktuelle Betriebsstatus von LD Express steht auf der Startseite.</p>
      <a class="text-link" href="/ld-express/">Zur Statusseite</a>
    </div>
  </main>
</body>
</html>
